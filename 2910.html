<!DOCTYPE html>
<html> 
    <title>Formulário de Cadastro</title>
    <head>
        <body>
            <form action="/submit" method="post">
                <fieldset>
                    <legend><h3>Dados Pessoais</h3></legend>
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome">
                    <br>
                   <br>
                    <label for="data-nascimento">Data de Nascimento:</label>
                    <input type="date" id="data-nascimento" name="data-nascimento">
                    <br>
                    <br>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email">
                 </fieldset>
                    <br>
                <fieldset>
                    <legend><h3>Dados Do Curso</h3></legend>
                    <label for="curso"><strong>Curso</strong></label>
                    <br>
                    <select name="curso" id="curso">
                        <option value="informatica">Informática</option>
                        <option value="administracao">Administração</option>
                        <option value="enfermagem">Enfermagem</option>
                    </select>

                    <br>
                    <br>

                    <label for="periodo"><Strong>periodo</Strong></label>

                    <br>

                     <label for="manha">Manhã</label>
                    <input type="radio" id="manha" name="periodo" value="manha">
                    <label for="tarde">Tarde</label>
                    <input type="radio" id="tarde" name="periodo" value="tarde">
                    <label for="noite">noite</label>
                    <input type="radio" id="noite" name="periodo" value="noite">

                    <br>
                    <br>
                    <button type="submit">Enviar Cadastro</button>
                </fieldset>
            </form>
        </body>
    </head>
</html>
